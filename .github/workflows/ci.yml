name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests, Pint, shellcheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sodium, mbstring, dom
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: ./vendor/bin/pest

      - run: ./vendor/bin/pint --test

      - run: shellcheck -s bash bin/wgla-helper tests/e2e/linux.sh tests/e2e/update.sh && shellcheck -s sh bin/wgla

  # Both supported LTS releases: 24.04 has classic sudo; 26.04 has sudo-rs and AppArmor profiles
  # that confine wg and wg-quick.
  e2e:
    name: Install and test for real (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sodium, mbstring, dom
          coverage: none

      # Like a server: the code lives outside the home directory, owned by the deploy user
      # (the runner), and the API runs as www-data.
      - name: Put the app in /srv/wgla
        run: |
          sudo install -d -o "$USER" -g "$(id -gn)" /srv/wgla
          cp -a "$GITHUB_WORKSPACE/." /srv/wgla/
          cd /srv/wgla && composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: php artisan wg:install --yes
        working-directory: /srv/wgla
        run: >-
          php artisan wg:install --yes --user=www-data --hostname=127.0.0.1 --forward=true
          --tls=http --bind=127.0.0.1 --port=8080

      - name: The installer leaves the checkout clean (wg:update refuses local changes)
        run: |
          changes=$(git -C /srv/wgla status --porcelain --untracked-files=no)
          [ -z "$changes" ] || { echo "$changes"; exit 1; }

      - name: A second run only checks
        working-directory: /srv/wgla
        run: php artisan wg:install --no-interaction

      - name: End-to-end checks
        run: sudo WGLA_E2E=1 /srv/wgla/tests/e2e/linux.sh /srv/wgla

      - name: Logs on failure
        if: failure()
        run: |
          set +e
          echo "=== wgla (API)"; sudo journalctl -u wgla -n 60 --no-pager
          echo "=== wg-quick units"; sudo journalctl -u 'wg-quick@*' -n 100 --no-pager
          echo "=== kernel and firewall"; uname -a; sudo nft --version; sudo iptables --version; sudo iptables -S FORWARD

  # What every installed server goes through: the version before this one, set up and in use,
  # is updated in place with wg:update. Its link and connected client have to come through, the
  # new version has to manage them, and the updated server has to pass what a new one does.
  update:
    name: Update a running server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      # With the history and the tags: the version to update from is in there
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sodium, mbstring, dom
          coverage: none

      # The last release before this commit, or simply the commit before it while there is none.
      # That commit can be one from before there was a wg:update: for a pull request it is the
      # branch that is merged into. No server could be updated from that, so then this commit is
      # the one installed, and what it is updated to is a release made from it (two steps on).
      # /srv/wgla is a clone of this checkout, which makes it the origin wg:update fetches from.
      - name: Install the version before this one in /srv/wgla
        run: |
          from=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^ 2>/dev/null || true)
          if [ -z "$from" ] && git cat-file -e 'HEAD^:app/Console/Commands/WgUpdate.php' 2>/dev/null; then from=$(git rev-parse HEAD^); fi
          if [ -z "$from" ]; then from=$(git rev-parse HEAD); echo "No version before this one has a wg:update: this commit is installed, and updated to a release made from it."; fi
          echo "Updating from $from: $(git log -1 --format='%h %s' "$from")"
          sudo install -d -o "$USER" -g "$(id -gn)" /srv/wgla
          git clone --quiet --no-checkout "$GITHUB_WORKSPACE" /srv/wgla
          git -C /srv/wgla checkout --quiet --detach "$from"
          cd /srv/wgla
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          php artisan wg:install --yes --user=www-data --hostname=127.0.0.1 --forward=true --tls=http --bind=127.0.0.1 --port=8080

      # The script is this commit's (the old version may not have it); the link is the old version's
      - name: A link with a connected client, on that version
        run: sudo WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" before /srv/wgla

      # As on a server: no arguments, so it takes the newest release. That is this commit, under
      # a tag that only exists on this runner. When this commit is what is installed already, it
      # is a release made from it, with the same code.
      - name: php artisan wg:update --yes
        working-directory: /srv/wgla
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" ]; then
            WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" release v9999.0.0 working
          else
            git -C "$GITHUB_WORKSPACE" tag v9999.0.0
          fi
          php artisan wg:update --yes

      - name: The link and its client came through, and the new version manages them
        run: sudo WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" after /srv/wgla "$(git rev-parse HEAD)"

      # This commit is the installed version now, and with that the one that has to find the way
      # back when a later release fails: code that can't be fixed any more once it is on a server.
      # So two releases that fail and one that works, made here and never leaving the runner.
      - name: A link with a connected client again, on this version
        run: sudo WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" before /srv/wgla

      - name: A release whose API is never healthy fails after the reload, and the update goes back
        working-directory: /srv/wgla
        run: |
          WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" release v9999.1.0 unhealthy
          if php artisan wg:update --yes; then echo "That update had to fail"; exit 1; fi
          sudo WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" back /srv/wgla "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"

      - name: A release that doesn't parse fails before any reload, and the update goes back
        working-directory: /srv/wgla
        run: |
          WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" release v9999.2.0 unparsable
          if php artisan wg:update --yes; then echo "That update had to fail"; exit 1; fi
          sudo WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" back /srv/wgla "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"

      - name: The release after those is an update like any other
        working-directory: /srv/wgla
        run: |
          WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" release v9999.3.0 working
          php artisan wg:update --yes
          sudo WGLA_E2E=1 "$GITHUB_WORKSPACE/tests/e2e/update.sh" after /srv/wgla "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"

      - name: Nothing is left for the installer to do
        working-directory: /srv/wgla
        run: php artisan wg:install --no-interaction

      - name: End-to-end checks, as on a new server
        run: sudo WGLA_E2E=1 /srv/wgla/tests/e2e/linux.sh /srv/wgla

      - name: Logs on failure
        if: failure()
        run: |
          set +e
          echo "=== versions"; git -C /srv/wgla log --oneline -3; grep -E '^(APP_VERSION|WGLA_)' /srv/wgla/.env
          echo "=== where the checkout has been"; git -C /srv/wgla reflog -8
          echo "=== wgla (API)"; sudo journalctl -u wgla -n 80 --no-pager
          echo "=== wg-quick units"; sudo journalctl -u 'wg-quick@*' -n 100 --no-pager
